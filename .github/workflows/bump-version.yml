name: Update Terraform Module Version

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to update'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      module_name:
        description: 'Name of the module to update (e.g., example)'
        required: true
        type: string
      module_version:
        description: 'New module version tag (e.g., v1.2.3)'
        required: true
        type: string

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update version reference
        run: |
          python scripts/update_version.py \
            --env "${{ inputs.environment }}" \
            --module "${{ inputs.module_name }}" \
            --version "${{ inputs.module_version }}"
            
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Update ${{ inputs.module_name }} to ${{ inputs.module_version }} in ${{ inputs.environment }}"
          branch: "update/${{ inputs.module_name }}/${{ inputs.module_version }}-${{ inputs.environment }}"
          delete-branch: true
          title: "Update ${{ inputs.module_name }} to ${{ inputs.module_version }} in ${{ inputs.environment }}"
          body: |
            ## Terraform Module Update
            **Environment:** `${{ inputs.environment }}`
            **Module:** `${{ inputs.module_name }}`
            **Target Version:** `${{ inputs.module_version }}`
            
            This PR was automatically generated by the Version Selection Pipeline.
          labels: "automated, terraform"
